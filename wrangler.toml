# MAL Rater — personal tool to score an anime backlog and write scores back to MAL.
name = "mal-rater"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

# Session tokens (MAL OAuth) live here, keyed by a cookie session id.
[[kv_namespaces]]
binding = "TOKENS"
id = "33910554b6cd4bcda463113ab25fad86"

# Secrets (set with `wrangler secret put`, NOT here):
#   MAL_CLIENT_ID       — from myanimelist.net/apiconfig
#   MAL_CLIENT_SECRET   — from the same MAL API app
